name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # shared-infra 운영 major와 동일(DEV_DESIGN §5-2, postgres:15-alpine)
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ohmyslack_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ohmyslack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohmyslack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ohmyslack_test:ci-only-not-a-secret@127.0.0.1:5432/ohmyslack_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
